<style>
:root{--tx:#eceaff;--dim:#9a97c4;--ac:#b7a6ff;--ok:#8ee3c8;--gl:rgba(255,255,255,.06);--gb:rgba(255,255,255,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
